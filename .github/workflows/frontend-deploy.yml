name: Frontend CI/CD (Test & Deploy)

on:
  push:
    branches: [ main ]

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar Dependencias
        run: npm ci

      - name: Ejecutar Pruebas Unitarias
        env:
          TZ: America/Lima
        run: npm test -- --watch=false --exclude="**/*.integration.spec.ts"

      - name: Ejecutar Pruebas de Integración
        env:
          TZ: America/Lima
        run: npm test -- --watch=false --include="**/*.integration.spec.ts"

      - name: Desplegar en Vercel
        if: success()
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: npx vercel@latest --prod --yes --token ${{ secrets.VERCEL_TOKEN }}
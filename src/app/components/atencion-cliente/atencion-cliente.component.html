<div class="rb-page">
  <nav
    class="rb-nav sticky top-0 z-50 flex flex-col items-stretch gap-3 bg-primary text-white shadow-sm dark:shadow-none sm:flex-row sm:items-center sm:justify-between"
  >
    <h1 class="rb-nav-title text-white">Atencion al cliente</h1>
    <div class="flex flex-col gap-2 sm:flex-row sm:flex-wrap sm:items-center sm:justify-end">
      <app-comprador-nav variant="primary" />
      <app-logout-button variant="on-dark" />
    </div>
  </nav>

  <div class="rb-container">
    <div *ngIf="paso() < 4" class="rb-card rb-card-pad mx-auto max-w-2xl">
      <div class="mb-6 flex items-center gap-3">
        <img src="/iconos/consulta-informacion-azul.png" alt="" width="32" height="32" class="h-8 w-8 object-contain" />
        <div>
          <h2 class="text-xl font-semibold text-gray-900 dark:text-dark-text-strong sm:text-2xl">
            Reporte de incidencia
          </h2>
          <p class="text-sm text-neutral-muted dark:text-dark-text-muted">Paso {{ paso() }} de 3</p>
        </div>
      </div>

      <p *ngIf="error()" class="mb-4 rounded-xl border border-danger/30 bg-red-50 px-3 py-2 text-sm text-danger dark:border-red-900/50 dark:bg-red-950/30 dark:text-red-200">
        {{ error() }}
      </p>

      <section *ngIf="paso() === 1" class="space-y-4">
        <label class="rb-label flex items-center gap-2">
          <img src="/iconos/documento.png" alt="" width="18" height="18" class="h-5 w-5 object-contain" />
          Pedido afectado (ultimas 48 horas)
        </label>
        <p *ngIf="cargandoPedidos()" class="text-sm text-neutral-muted dark:text-dark-text-muted">Cargando pedidos...</p>
        <select
          *ngIf="!cargandoPedidos()"
          class="rb-input w-full"
          [(ngModel)]="orderId"
        >
          <option value="">Selecciona un pedido</option>
          <option *ngFor="let p of pedidos()" [value]="p.orderId">{{ p.label }}</option>
        </select>
        <p *ngIf="!cargandoPedidos() && pedidos().length === 0" class="text-sm text-amber-700 dark:text-amber-200">
          No tienes pedidos en las ultimas 48 horas.
        </p>
      </section>

      <section *ngIf="paso() === 2" class="space-y-4">
        <label class="rb-label">Categoria del reclamo</label>
        <select class="rb-input w-full" [(ngModel)]="categoria">
          <option value="">Selecciona una opcion</option>
          <option *ngFor="let c of categorias" [value]="c.value">{{ c.label }}</option>
        </select>
      </section>

      <section *ngIf="paso() === 3" class="space-y-4">
        <label class="rb-label" for="desc-problema">Descripcion del problema</label>
        <textarea
          id="desc-problema"
          class="rb-input min-h-[8rem] w-full resize-y"
          [(ngModel)]="descripcion"
          [maxlength]="maxDesc"
          placeholder="Explica brevemente lo ocurrido..."
        ></textarea>
        <p class="text-xs text-neutral-muted dark:text-dark-text-muted">
          {{ charsRestantes() }} caracteres restantes
        </p>
        <label class="rb-label !normal-case !mb-2">Evidencia (opcional)</label>
        <div
          (drop)="onDrop($event)"
          (dragover)="onDragOver($event)"
          (dragleave)="onDragLeave()"
          [class.ring-2]="dragActivo()"
          [class.ring-primary/40]="dragActivo()"
          class="relative flex min-h-[9rem] cursor-pointer flex-col items-center justify-center rounded-2xl border-2 border-dashed border-gray-300 bg-white px-4 py-6 dark:border-dark-border dark:bg-dark-surface"
        >
          <input
            type="file"
            accept="image/jpeg,image/jpg,image/png"
            class="sr-only"
            #fileInp
            (change)="onFileSelected($event)"
          />
          <button
            type="button"
            (click)="fileInp.click()"
            class="flex flex-col items-center gap-2 text-center text-sm font-medium text-neutral-strong dark:text-dark-text-muted"
          >
            <img src="/iconos/documento.png" alt="" width="32" height="32" class="h-8 w-8 object-contain opacity-80" />
            <span>Toca para elegir o arrastra una imagen (JPG / PNG, max. 5MB)</span>
          </button>
        </div>
        <div *ngIf="previewUrl" class="rounded-xl border border-gray-200 bg-gray-50 p-3 dark:border-dark-border dark:bg-slate-900/50">
          <img [src]="previewUrl" alt="Vista previa" class="mx-auto max-h-48 w-full object-contain" />
          <button type="button" (click)="quitarArchivo()" class="rb-btn-neutral mt-3 w-full text-sm">Quitar imagen</button>
        </div>
      </section>

      <div class="mt-8 flex flex-col gap-2 sm:flex-row sm:justify-between">
        <button
          type="button"
          *ngIf="paso() > 1"
          (click)="pasoAnterior()"
          class="rb-btn-secondary min-h-11 w-full sm:w-auto"
        >
          Atras
        </button>
        <button
          type="button"
          *ngIf="paso() < 3"
          (click)="siguientePaso()"
          class="rb-btn-primary min-h-11 w-full sm:ml-auto sm:w-auto"
        >
          Siguiente
        </button>
        <button
          type="button"
          *ngIf="paso() === 3"
          (click)="enviarReporte()"
          [disabled]="enviando()"
          class="rb-btn-primary min-h-11 w-full sm:ml-auto sm:w-auto disabled:pointer-events-none disabled:opacity-45"
        >
          {{ enviando() ? 'Enviando...' : 'Enviar reporte' }}
        </button>
      </div>
    </div>

    <div *ngIf="paso() === 4" class="rb-card rb-card-pad mx-auto max-w-lg text-center">
      <div class="rb-modal-icon !mb-6 mx-auto">
        <img
          src="/iconos/correcto-check-verde.png"
          alt=""
          width="56"
          height="56"
          class="mx-auto h-14 w-14 object-contain"
        />
      </div>
      <h2 class="mb-2 text-xl font-semibold text-gray-900 dark:text-dark-text-strong sm:text-2xl">
        Reporte enviado
      </h2>
      <p class="mb-4 text-sm text-neutral-strong dark:text-dark-text-muted">
        Recibimos tu caso. Te contactaremos a la brevedad.
      </p>
      <p class="mb-8 text-lg font-bold text-primary dark:text-orange-300">{{ ticketCode() }}</p>
      <button type="button" (click)="volverMenu()" class="rb-btn-primary min-h-11 w-full sm:w-auto">
        Volver al menu
      </button>
    </div>
  </div>
</div>
